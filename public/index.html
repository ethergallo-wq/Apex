  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/Apex_logo_32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1C1E" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Apex" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Apex: esplora, avvista e registra animali nel tuo dex personale."
    />
    <meta property="og:title" content="Apex" />
    <meta property="og:description" content="Esplora, avvista e registra animali nel tuo dex personale." />
    <meta property="og:image" content="%PUBLIC_URL%/web_app.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="%PUBLIC_URL%/web_app.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/web_app.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <style>
      @keyframes apex-boot-pop {
        0% { opacity: 0.35; transform: scale(0.82) rotate(-6deg); }
        55% { opacity: 1; transform: scale(1.06) rotate(2deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      #apex-inline-boot .apex-boot-icon { animation: apex-boot-pop 180ms cubic-bezier(0.22, 1, 0.36, 1); }
    </style>
    <script>
      (function () {
        try {
          if (window.location.hash === "#") {
            window.history.replaceState(null, document.title, window.location.pathname + window.location.search);
          }
          window.__APEX_SHOW_BOOT_FALLBACK__ = function () {
            var root = document.getElementById("root");
            if (!root || root.dataset.apexFallback === "true" || root.childElementCount > 0) return;
            root.dataset.apexFallback = "true";
            root.innerHTML = '<div style="min-height:100vh;background:#1C1C1E;color:white;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-align:center"><div><div style="font-size:24px;font-weight:900;margin-bottom:8px">Apex si sta ricaricando</div><div style="color:rgba(255,255,255,.68);font-size:14px;line-height:1.45;margin-bottom:16px">Chiudi e riapri l\\u0027app dalla schermata Home. Se continua, aprila una volta da Safari.</div><button onclick="window.location.reload()" style="height:44px;border:0;border-radius:14px;background:#B84D3A;color:white;font-weight:900;padding:0 18px">Ricarica</button></div></div>';
          };
        } catch (e) {}
      })();
    </script>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Apex</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="apex-inline-boot" style="min-height:100vh;min-height:100dvh;background:radial-gradient(circle at 50% 18%, rgba(184,77,58,.16), transparent 42%), #111113;color:white;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
          <div id="apex-inline-boot-icon" class="apex-boot-icon" style="width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.28)">
            <img id="apex-inline-boot-img" alt="" decoding="async" style="width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))" />
          </div>
          <div style="color:rgba(255,255,255,.78);font-weight:900;font-size:15px;letter-spacing:.2px">Apertura Apex...</div>
          <div id="apex-inline-boot-name" style="color:rgba(255,255,255,.48);font-weight:800;font-size:12px;min-height:16px"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var animals = [
          { slug: 'melanocetus-johnsonii', name: 'Rana pescatrice' },
          { slug: 'ornithorhynchus-anatinus', name: 'Ornitorinco' },
          { slug: 'psychrolutes-marcidus', name: 'Pesce blob' },
          { slug: 'vampyroteuthis-infernalis', name: 'Vampiro degli abissi' },
          { slug: 'macropinna-microstoma', name: 'Pesce dal cappuccio' },
          { slug: 'eurypharynx-pelecanoides', name: 'Anguilla pellicano' },
          { slug: 'hymenopus-coronatus', name: 'Mantide orchidea' },
          { slug: 'gonodactylus-smithii', name: 'Gambero mantide' },
          { slug: 'uroplatus-phantasticus', name: 'Geco foglia' },
          { slug: 'brookesia-micra', name: 'Camaleonte nano' },
          { slug: 'nautilus-pompilius', name: 'Nautilus' },
          { slug: 'argonauta-argo', name: 'Polpo di vetro' },
          { slug: 'galeopithecus-volans', name: 'Colugo' },
          { slug: 'uakari-calvus', name: 'Uacari calvo' },
          { slug: 'rhynochetos-jubatus', name: 'Kagu' },
          { slug: 'saiga-tatarica', name: 'Saiga' },
          { slug: 'steatornis-caripensis', name: 'Uccello del petrolio' },
          { slug: 'priodontes-maximus', name: 'Tatù gigante' },
          { slug: 'atractosteus-spatula', name: 'Pesce alligatore' },
          { slug: 'tarsius-syrichta', name: 'Tarsio' }
        ];
        for (var i = animals.length - 1; i > 0; i -= 1) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = animals[i];
          animals[i] = animals[j];
          animals[j] = tmp;
        }
        animals.forEach(function (animal) {
          var preload = new Image();
          preload.src = '%PUBLIC_URL%/animals/thumbs/' + animal.slug + '.webp';
        });
        var img = document.getElementById('apex-inline-boot-img');
        var name = document.getElementById('apex-inline-boot-name');
        var icon = document.getElementById('apex-inline-boot-icon');
        var idx = 0;
        function show() {
          if (!img || !name || !icon) return;
          var current = animals[idx % animals.length];
          img.src = '%PUBLIC_URL%/animals/thumbs/' + current.slug + '.webp';
          name.textContent = current.name;
          icon.classList.remove('apex-boot-icon');
          void icon.offsetWidth;
          icon.classList.add('apex-boot-icon');
          idx += 1;
        }
        show();
        window.setInterval(show, 180);
      })();
    </script>

    -->
  </body>
</html>
